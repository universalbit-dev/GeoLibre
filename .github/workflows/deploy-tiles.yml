name: Deploy tiles

on:
  push:
    branches: [main]
    paths:
      - "workers/tiles/**"
      - ".github/workflows/deploy-tiles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gate:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Verify Cloudflare secrets are configured
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Missing Cloudflare deployment secrets: ${missing[*]}."
            exit 1
          fi
          echo "::warning::Skipping the tile worker deploy because Cloudflare secrets are not configured: ${missing[*]}."

  deploy:
    name: Deploy planetary tile proxy to Cloudflare Workers
    needs: secrets-gate
    runs-on: ubuntu-latest
    # workflow_dispatch can target any branch; only ever deploy main to
    # production so a manual run can't publish unmerged code.
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      needs.secrets-gate.outputs.present == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Unlike the viewer/collab workers, this one has a real runtime dependency
      # (upng-js) that wrangler must bundle, so the workspace deps have to be
      # installed before deploy. wrangler-action does not install for us.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tiles
