name: Deploy viewer

on:
  push:
    branches: [main]
    paths:
      - "workers/viewer/**"
      - ".github/workflows/deploy-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gate:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Verify Cloudflare secrets are configured
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Missing Cloudflare deployment secrets: ${missing[*]}."
            exit 1
          fi
          echo "::warning::Skipping the viewer worker deploy because Cloudflare secrets are not configured: ${missing[*]}."

  deploy:
    name: Deploy viewer proxy to Cloudflare Workers
    needs: secrets-gate
    if: success() && needs.secrets-gate.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/viewer
