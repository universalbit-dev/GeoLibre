name: Deploy collab

on:
  push:
    branches: [main]
    paths:
      - "workers/collab/**"
      - ".github/workflows/deploy-collab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-collab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy collaboration relay to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check deploy prerequisites
        id: prerequisites
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" || -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured."
              exit 1
            fi
            echo "::warning::Cloudflare deploy secrets are not configured; skipping collab deploy for ${GITHUB_EVENT_NAME}."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.prerequisites.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/collab
